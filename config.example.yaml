# apex 配置模板 —— 复制本文件为 config.yaml 后填入你自己的 token。
#   cp config.example.yaml config.yaml
# config.yaml 已被 .gitignore 忽略，不会进版本库。
#
# 取值优先级：YAML 里的值 > 环境变量 > 留空。
# 即：YAML 留空时回退到对应环境变量。

tushare:
  token: ""                     # tushare.pro 注册获取（或 env TUSHARE_TOKEN）

deepseek:
  api_key: ""                   # platform.deepseek.com 获取（或 env DEEPSEEK_API_KEY）
  base_url: "https://api.deepseek.com"   # OpenAI 兼容端点；火山方舟等亦可
  model: "deepseek-chat"        # deepseek-chat=V3, deepseek-reasoner=R1
  max_tool_iterations: 12       # AI 工具调用循环上限
  history_limit: 8              # 分析时注入 prompt 的历史判断条数（降序取最新 N 条）

bocha:
  api_key: ""                   # web 搜索（或 env BOCHA_API_KEY）

mx:
  api_key: ""                   # 妙想金融数据 API（或 env MX_APIKEY）

langsmith:
  enabled: false                # true 时追踪个股 AI 分析（或 env LANGSMITH_TRACING=true）
  api_key: ""                   # smith.langchain.com 获取（或 env LANGSMITH_API_KEY）
  workspace_id: ""              # key 可访问多个 workspace 时必填（或 env LANGSMITH_WORKSPACE_ID）
  project: "apex-ai-analysis"  # LangSmith 项目名（或 env LANGSMITH_PROJECT）

paths:
  journal_dir: "~/.stock-journal"
  watchlist_file: "~/.stock-watchlist/watchlist.json"
  prompt_file: "apex/prompts/expert-persona.md"
  screener_dir: "~/.stock-journal/screener"
  screener_prompt_file: "apex/prompts/screener_quick.md"

backtest:
  lookforward_days: 10
  min_entries_for_analysis: 5
  min_review_samples: 8        # AI 复盘最小可成交信号数，不足则不跑(无统计意义) + 不反哺
  max_inject_age_days: 30      # 复盘 prompt_injection 反哺 analyze 的最大时效(天)，过期不注入
  oos_test_days: 30            # #7 OOS 验证：最近 N 天信号作 test 集，更早的作 train 派生 weight_hint
  costs:
    commission_rate: 0.00025   # 佣金 万2.5（双向）
    stamp_duty_rate: 0.001     # 印花税 千1（卖出）
    slippage: 0.001            # 单边滑点 10bp（小盘流动性差，双边 20bp）；vbt from_signals 的 slippage 参数
  trade_signal_gate:
    mode: "shadow"             # off=旧逻辑 / shadow=并行记录不影响正式交易 / enforced=正式启用
    version: "v1"              # 影子验证期间冻结；调参必须升级版本并重新累计样本
    min_reward_risk: 1.3
    default_valid_for_days: 3

notify:
  enabled: true
  channel: "console"           # console（终端打印）| bark（iOS 推送）
  bark:
    base_url: ""               # 例: https://api.day.app/<your-key>/
    group: "apex"              # bark 通知分组名,同组通知在通知中心折叠

# 全局 HTTP 代理（影响 DeepSeek/tushare/bocha 等所有出站请求）。
# 留空则不走代理。新浪行情接口为国内服务，代码中显式 bypass，不受此配置影响。
# 也可用环境变量 HTTPS_PROXY / HTTP_PROXY 覆盖此值。
proxy:
  http_proxy: ""               # 例: http://127.0.0.1:7890
  https_proxy: ""
  no_proxy: ""                 # 例: localhost,127.0.0.1,.cn

screener:
  enabled: true
  ai_enabled: true             # 关掉则只跑规则层不调 AI
  ai_model: "deepseek-chat"    # 复用现有 DeepSeek client
  top_n_for_ai: 15
  rule_weights:
    dragon_tiger: 2.0
    limit_up: 1.8
    concept: 1.5
    northbound: 1.2
    industry: 1.0
  multi_signal_bonus:          # 命中信号类型数 -> 额外加分
    "1": 0.0
    "2": 0.5
    "3": 1.0
    "4": 1.5
    "5": 2.0
  filters:
    min_float_mv_yi: 30          # 排除流通市值 < 30 亿（单位：亿元）
    exclude_st: true              # 排除 ST 股
    exclude_new_listings_days: 60 # 排除上市 60 天内的新股
  concurrency: 8

# 持仓推送：apex 主动调用消费方 webhook，把持仓变更推出去。
# 接口文档见 docs/integration/positions-push-api.md
# 不设应用层鉴权（明文 JSON）；如需接入控制在消费方网关层做。
push:
  enabled: false                                    # 默认关；填好 base_url 后改 true
  base_url: "http://127.0.0.1:8899/api/apex"        # 消费方 webhook base
  path: "/positions/push"                           # 拼到 base_url 后；默认 /positions/push
  timeout_seconds: 10
  retry:
    max_attempts: 5                                 # 含首次共 5 次
    base_seconds: 1                                 # 指数退避基数
    max_seconds: 60
  full:
    cron: "0 16 * * 1-5"                            # 每交易日 16:00 全量对账（占位，cron 调度未实现）
    on_startup: false                               # apex 启动时先推一次全量
  incremental:
    enabled: true                                   # 持仓变更实时推（总开关 push.enabled=false 时仍不发）
  log_file: "~/.stock-journal/push_log.jsonl"       # 推送审计日志（落盘，供 replay/排障）

# 自动撮合（模拟实盘）：apex.automation --auto-trade 模式用。
# enabled=false 时 task_auto_trade/task_screener_and_promote 跳过（本地人工环境保持 false）；
# 服务器部署改 true + cron 每交易日 ~18:30 跑 `python -m apex.automation --auto-trade`
# （tushare 当日日线 ~17:00 后才更新，故晚于收盘跑）。
# 成交价=trigger_price（写死保口径一致）；T+1；单只失败不中断；幂等靠状态机。
# 已知简化：涨跌停/除权未还原，首版接受。
auto_trade:
  enabled: false
  top_n_picks: 5               # 粗筛后分析几只（按 ai_score 降序）
  holding_period_days: 10      # 持有期满强制平仓（exit_reason=expired）
  bullish_verdicts: ["看多", "偏多"]   # 哪些 verdict 入候选（不含"观望偏多"--历史胜率 12.5% 太低）

# 板块散户情绪两层预警（个人研究/影子模式，不触发交易）。
# MediaCrawler 必须安装在仓库外并固定 commit；其许可证仅允许非商业学习研究。
# 首次运行前在 MediaCrawler 内人工扫码登录并确认 JSONL 输出正常。
sector_sentiment:
  enabled: false
  cache_dir: "~/.stock-sentiment"
  mediacrawler_path: "~/workspace/tools/MediaCrawler"
  mediacrawler_commit: ""       # 必填：`git -C <path> rev-parse HEAD`
  policy_override_reason: ""    # 提前迁移冻结采集策略时必填；首次预约新 cohort 后删除
  platforms: ["bili", "dy"]  # eastmoney 在 phase=shadow 时不属于活跃评分平台
  timeout_seconds: 900
  market_data_enabled: true    # 用 akshare 板块日线更新背离和成熟事件标签
  llm_enabled: true            # 低置信文本使用 DeepSeek 固定结构分类；false=规则基线
  llm_model_version: "sector-semantic-llm-v1"
  semantic_llm_model: "deepseek-chat"   # 实际调用模型，60日 cohort 内冻结
  relevance_llm_model: "deepseek-chat"  # 金融准入裁决模型，60日 cohort 内冻结
  semantic_prompt_version: "sector-semantic-v1"
  # 东方财富股吧：Apex 自研 Scrapy 采集器，仅访问公开免登录页面。
  # author_salt 请在本机替换为随机值；不要提交真实盐值、Cookie 或账号信息。
  eastmoney:
    enabled: false
    phase: shadow              # shadow只采集审计；完成14个质量达标日后人工改promoted
    promotion_override_reason: ""  # 未满14个合格影子日时，promoted必须填写人工审计原因
    access_mode: public
    lookback_hours: 24
    overlap_hours: 2
    constituent_count: 5
    posts_per_sector_forum: 100
    posts_per_constituent_forum: 50
    comments_per_post: 50
    concurrent_requests_per_domain: 1
    download_delay_seconds: 2
    timeout_seconds: 20
    collection_timeout_seconds: 900
    retry_times: 3
    circuit_breaker_failures: 5
    max_requests: 500
    max_comment_requests: 200      # 评论独立子额度；耗尽不阻断帖子列表和详情
    requests_per_target: 100
    minimum_posts: 1
    minimum_authors: 1
    minimum_parse_success_rate: 0.8
    schema_version: "eastmoney-public-v1"
    target_pool_version: "eastmoney-target-v1"
    author_salt: "CHANGE-ME-LOCAL-ONLY"
    endpoints:
      list_url_template: "https://guba.eastmoney.com/list,{forum_id}.html"
      list_next_url_template: "https://guba.eastmoney.com/list,{forum_id}_{page}.html"
      detail_url_template: "https://guba.eastmoney.com/news,{forum_id},{content_id}.html"
      comments_url_template: "https://guba.eastmoney.com/api/getData?code={forum_id}&path=reply/api/Reply/ArticleNewReplyList&postid={content_id}"
  retrieval:
    query_version: "sector-finance-query-v1"
    query_templates: ["{term} 股票", "{term} A股", "{term} 板块", "{term} 概念股", "{term} ETF", "{term} 龙头", "{term} 投资", "{term} 行情"]
    max_queries_per_sector: 3
    max_contents_per_query: 8
    max_comments_per_content: 20
    creator_id_argument: "--creator_id"
    candidate_min_contents: 3
    candidate_min_sectors: 2
    very_high_relevance: 0.9
    high_engagement_thresholds: {bili: 1000, dy: 1000}
    relevance_version: "sector-finance-relevance-v1"
    relevance_llm_enabled: true  # 仅裁决金融相关性，不输出情绪/预警分数
    creator_rule_version: "sector-finance-creator-v1"
  keywords: ["机器人", "算力", "创新药"]
  # 正式运行应扩充为完整的申万行业＋东方财富概念版本化词典。
  taxonomy:
    - sector_id: "concept:robot"
      sector_name: "机器人"
      taxonomy: "concept"
      aliases: ["机器人", "人形机器人", "具身智能"]
      eastmoney_forum_id: ""  # 人工核验后填写；采集器不会猜测吧ID
    - sector_id: "concept:compute"
      sector_name: "算力"
      taxonomy: "concept"
      aliases: ["算力", "AI服务器", "数据中心"]
    - sector_id: "concept:innovative-drug"
      sector_name: "创新药"
      taxonomy: "concept"
      aliases: ["创新药", "国产新药", "医药出海"]
