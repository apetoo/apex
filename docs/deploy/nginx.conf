# 反代 /api → 127.0.0.1:8000
# 静态资源直接服务 vite build 的 dist/
# gzip + 强缓存(JS/CSS 1y, index.html 不缓存, /api 不缓存)
# 放 /etc/nginx/sites-available/apex, ln -s 到 sites-enabled, nginx -t 验证

server {
    listen 80;
    server_name apex.local _;

    # 静态资源(前端 build 产物)
    root /home/deploy/apex/frontend/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 强缓存: 哈希命名的 JS/CSS / 字体
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API: 不缓存, SSE 禁用缓冲(proxy_buffering off)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE 必须
        proxy_cache off;            # 行情 / AI 流式 都不缓存
        proxy_read_timeout 600s;    # AI 分析可能跑 5-10 分钟
    }

    # SPA 兜底: 所有非静态请求 → index.html(react-router 接管)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
