[project]
name = "apex"
version = "0.1.0"
description = "A股 AI 交易闭环系统：DeepSeek AI 分析 + 持仓追踪 + vectorbt 回测 + 盘后粗筛 + 模拟实盘自动化"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pytest>=8.0.0",
    "scrapy>=2.13,<2.14",
    "sse-starlette>=2.0",
    "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
include = ["apex*"]
